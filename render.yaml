# Render Blueprint: one free web service running `next start`.
# Render → New → Blueprint → pick this repo. It asks for the values marked sync: false.
services:
  - type: web
    name: orvenic
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://orvenic.com
      - key: FIREBASE_PROJECT_ID
        value: resume-project-56b09
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Orvenic <hello@orvenic.com>
      - key: FOUNDER_EMAIL
        sync: false
      - key: FREE_SCAN_SALT
        generateValue: true
